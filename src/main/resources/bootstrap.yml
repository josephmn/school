server:
  port: 9595
spring:
  application:
    name: school
    version: "@project.version@"
  banner:
    location: classpath:banner/banner-${SPRING_PROFILES_ACTIVE}.txt
  output:
    ansi:
      enabled: ALWAYS
  r2dbc:
    url: ${MYSQL_HOST}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    pool:
      enabled: true
      max-size: 10
      initial-size: 5
      max-idle-time: 10m
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
  api-docs:
    enabled: true
    path: /v3/api-docs
openapi:
  info:
    title: School API - ${SPRING_PROFILES_ACTIVE}
    github:
      url: https://github.com/josephmn/school.git
      definition: https://github.com/josephmn/school/blob/main/src/main/resources/openapi.yaml
    terms: http://swagger.io/terms/
    contact:
      name: Joseph Magallanes
      email: josephcarlos.jcmn@gmail.com
      url: https://www.linkedin.com/in/joseph-magallanes-nolazco/
    servers:
      url: http://localhost:${server.port}
      description: Local server Swagger
logging:
  level:
    root: INFO
#    org.springframework.r2dbc.core: DEBUG
#    io.r2dbc.spi: DEBUG
created:
  by: Joseph Magallanes
  email: josephcarlos.jcmn@gmail.com
