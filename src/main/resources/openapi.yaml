openapi: 3.0.4
info:
  title: School API
  version: 1.0.0
  #  description: API para gestionar colegio
  description: |-
    API gestion school, this API is a simple example of how to use OpenAPI 3.0 with Spring Boot.

    Some useful links:
    - [Developer LinkedIn](https://www.linkedin.com)
    - [Repository GitHub](https://github.com/josephmn/school/tree/main/src/main/resources/openapi.yaml)
  termsOfService: https://swagger.io/terms/
  contact:
    email: josephcarlos.jcmn@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
#servers:
#  - url: http://localhost:8082
tags:
  - name: people
    description: Operations about people
  - name: students
    description: Operations about students
paths:
  /people:
    get:
      tags:
        - peoples
      summary: Get all people.
      description: Get all people.
      operationId: getAllPeople
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponsePeopleDto'
        '400':
          description: Invalid username supplied
        '404':
          description: User not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - peoples
      summary: Create people.
      description: Create people in database.
      operationId: createPeople
      requestBody:
        description: Created user object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPeopleDto'
        required: true
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePeopleDto'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

